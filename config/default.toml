[agent]
name = "Aegis"
max_tool_rounds = 24
approval_mode = "ask"

[model]
# Local model files only. No hosted provider or remote inference endpoint.
backend = "llama.cpp"
format = "gguf"
model_path = "models/aegis-model.gguf"
context_length = 4096
gpu_layers = "auto"

[runtime]
mode = "local"
working_directory = "."
require_approval_for_destructive_actions = true
allow_network = false

[adaptive]
enabled = true
profile = "auto"
reserve_memory_mb = 512
max_context_length = 16384
